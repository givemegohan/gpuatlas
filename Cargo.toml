[package]
name = "gpuatlas"
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/givemegohan/gpuatlas"
description = "GPU-resident ForceAtlas-2-style network viewer (Rust + wgpu/WebGPU), 30k nodes"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wgpu = "30"
bytemuck = { version = "1", features = ["derive"] }
cfg-if = "1"
futures-channel = "0.3"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["HtmlCanvasElement"] }
console_error_panic_hook = "0.1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
pollster = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3

# The cargo --release output is already optimized; the wasm-opt step is
# disabled so `wasm-pack build` stays reproducible without extra downloads.
[package.metadata.wasm-pack.profile.release]
wasm-opt = false
